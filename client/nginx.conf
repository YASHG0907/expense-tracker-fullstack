server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # This is the critical line for React Router.
        # Without it, refreshing the page on a route like /expenses
        # would 404, because nginx would look for a literal file
        # at /expenses on disk, which doesn't exist — React Router
        # only handles that routing client-side, inside index.html.
        try_files $uri $uri/ /index.html;
    }
}